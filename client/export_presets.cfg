[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="config/*.json"
exclude_filter="tools/*,.agent-qa/*,LocalLow/*"
export_path="../.local-build/web/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug="../.local-build/web_nothreads_debug.zip"
custom_template/release="../.local-build/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/realm_shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
