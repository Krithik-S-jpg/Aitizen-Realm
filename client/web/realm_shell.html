for(let i=0;i<5;i++){const x=(((t/85+i*19)%(width+160))-80),y=height*.23+Math.sin(x/width*3)*height*.04+Math.abs(i-2)*7,wing=Math.sin(t/210+i)*3;ctx.beginPath();ctx.moveTo(x-5,y-wing);ctx.quadraticCurveTo(x-2,y-2,x,y+1);ctx.quadraticCurveTo(x+2,y-2,x+5,y-wing);ctx.stroke();}
// Brief elliptical ripples stay within the lower lake when touched.
for(let i=ripples.length-1;i>=0;i--){const r=ripples[i],age=(t-r.born)/1800;if(age>1){ripples.splice(i,1);continue;}ctx.strokeStyle='rgba(211,221,198,'+(Math.max(0,1-age)*.35)+')';ctx.beginPath();ctx.ellipse(r.x,r.y,8+age*55,2+age*10,0,0,Math.PI*2);ctx.stroke();}
if(!root.classList.contains('dawn'))for(let i=0;i<9;i++){const x=width*(.12+i*.09)+Math.sin(t/2200+i)*9,y=height*.71+Math.sin(i*7)*height*.08+Math.cos(t/3200+i)*5;ctx.fillStyle='rgba(225,195,122,'+(.18+Math.sin(t/1700+i)*.13)+')';ctx.beginPath();ctx.shadowColor='#dfc57b';ctx.shadowBlur=7;ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
}
function tick(t){if(!root.isConnected)return;if(!document.hidden&&t-last>33){draw(reduced.matches?0:t);last=t;}frame=requestAnimationFrame(tick);}
resize();window.addEventListener('resize',resize);frame=requestAnimationFrame(tick);
window.stopRealmScene=()=>{cancelAnimationFrame(frame);window.removeEventListener('resize',resize);};
})();
</script>
<script src="$GODOT_URL"></script><script>
const config=$GODOT_CONFIG;
const overlay=document.getElementById('loading'),bar=document.getElementById('progress'),amount=document.getElementById('amount'),stage=document.getElementById('stage');

try{const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});if(missing.length)throw new Error('This browser is missing: '+missing.join(', '));const engine=new Engine(config);engine.startGame({onProgress(current,total){if(total>0){bar.max=total;bar.value=current;amount.textContent=Math.min(100,Math.floor(current/total*100))+'%';stage.textContent=current>=total?'Starting…':'Loading…';}else{bar.removeAttribute('value');amount.textContent=current>0?(current/1048576).toFixed(1)+' MB':'—';}}}).then(()=>{stage.textContent='Ready';requestAnimationFrame(()=>requestAnimationFrame(()=>{overlay.classList.add('done');document.getElementById('canvas').focus({preventScroll:true});setTimeout(()=>{window.stopRealmScene?.();overlay.remove();},matchMedia('(prefers-reduced-motion: reduce)').matches?0:1250);}));}).catch(fail);}catch(error){fail(error);}
