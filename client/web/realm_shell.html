<script>
(()=>{
const root=document.getElementById('loading'),light=document.getElementById('light'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
light.addEventListener('click',()=>{const dawn=root.classList.toggle('dawn');light.setAttribute('aria-pressed',String(dawn));document.getElementById('light-text').textContent=dawn?'Night':'Sunrise';});
root.addEventListener('pointermove',event=>{if(reduced.matches)return;root.style.setProperty('--px',((event.clientX/innerWidth-.5)*-12)+'px');root.style.setProperty('--py',((event.clientY/innerHeight-.5)*-8)+'px');});
const canvas=document.getElementById('sky-particles'),ctx=canvas.getContext('2d');if(!ctx)return;let width=0,height=0,last=0,frame;
const stars=Array.from({length:45},(_,i)=>({x:((i*73+19)%997)/997,y:((i*137+43)%541)/1000,r:i%5===0?1.3:.65}));
function resize(){width=canvas.width=Math.round(innerWidth);height=canvas.height=Math.round(innerHeight);draw(0);}
const lanterns=[];document.getElementById("lantern").addEventListener("click",()=>{if(lanterns.length>=10)return;lanterns.push({x:width*(.3+Math.random()*.4),born:performance.now(),phase:Math.random()*6});if(reduced.matches)draw(0);});const ripples=[];root.addEventListener("pointerdown",event=>{if(reduced.matches||event.target.closest("button,a,header,.bottom")||event.clientY<innerHeight*.58)return;ripples.push({x:event.clientX,y:event.clientY,born:performance.now()});if(ripples.length>8)ripples.shift();});function draw(t){ctx.clearRect(0,0,width,height);for(let i=0;i<stars.length;i++){const p=stars[i];ctx.fillStyle='rgba(224,230,211,'+(root.classList.contains('dawn')?.12:.3+Math.sin(t/2300+i)*.18)+')';ctx.beginPath();ctx.arc(p.x*width,p.y*height,p.r,0,Math.PI*2);ctx.fill();}
// Lanterns are deliberately bounded and decorative, never simulation actions.
for(let i=lanterns.length-1;i>=0;i--){const l=lanterns[i],age=reduced.matches?1:(t-l.born)/1000;if(age>12){lanterns.splice(i,1);continue;}const x=l.x+Math.sin(age*.7+l.phase)*12,y=height*.68-age*height*.045;ctx.save();ctx.globalAlpha=Math.min(1,Math.max(0,(12-age)/3));const glow=ctx.createRadialGradient(x,y,0,x,y,20);glow.addColorStop(0,'#f8be5655');glow.addColorStop(1,'#f8be5600');ctx.fillStyle=glow;ctx.fillRect(x-20,y-20,40,40);ctx.fillStyle='#dca35c';ctx.beginPath();ctx.roundRect(x-4,y-6,8,11,2);ctx.fill();ctx.fillStyle='#ffe3a0';ctx.fillRect(x-2,y,4,4);ctx.restore();}
const meteor=(t%18000)/1000;if(!reduced.matches&&!root.classList.contains('dawn')&&meteor>11&&meteor<12.2){const u=(meteor-11)/1.2,x=width*(.58+u*.16),y=height*(.12+u*.12);ctx.strokeStyle='rgba(233,225,200,'+(Math.sin(u*Math.PI)*.5)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-35,y-16);ctx.lineTo(x,y);ctx.stroke();}// A distant flock follows a slow arc above the mountains.
ctx.lineWidth=1.3;ctx.strokeStyle=root.classList.contains('dawn')?'#243d42':'#8fa6a555';
for(let i=0;i<5;i++){const x=(((t/85+i*19)%(width+160))-80),y=height*.23+Math.sin(x/width*3)*height*.04+Math.abs(i-2)*7,wing=Math.sin(t/210+i)*3;ctx.beginPath();ctx.moveTo(x-5,y-wing);ctx.quadraticCurveTo(x-2,y-2,x,y+1);ctx.quadraticCurveTo(x+2,y-2,x+5,y-wing);ctx.stroke();}
// Brief elliptical ripples stay within the lower lake when touched.
for(let i=ripples.length-1;i>=0;i--){const r=ripples[i],age=(t-r.born)/1800;if(age>1){ripples.splice(i,1);continue;}ctx.strokeStyle='rgba(211,221,198,'+(Math.max(0,1-age)*.35)+')';ctx.beginPath();ctx.ellipse(r.x,r.y,8+age*55,2+age*10,0,0,Math.PI*2);ctx.stroke();}
if(!root.classList.contains('dawn'))for(let i=0;i<9;i++){const x=width*(.12+i*.09)+Math.sin(t/2200+i)*9,y=height*.71+Math.sin(i*7)*height*.08+Math.cos(t/3200+i)*5;ctx.fillStyle='rgba(225,195,122,'+(.18+Math.sin(t/1700+i)*.13)+')';ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill();}
}
function tick(t){if(!root.isConnected)return;if(!document.hidden&&t-last>50){draw(reduced.matches?0:t);last=t;}frame=requestAnimationFrame(tick);}
resize();window.addEventListener('resize',resize);frame=requestAnimationFrame(tick);
window.stopRealmScene=()=>{cancelAnimationFrame(frame);window.removeEventListener('resize',resize);};
})();
</script>

try{const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});if(missing.length)throw new Error('This browser is missing: '+missing.join(', '));const engine=new Engine(config);engine.startGame({onProgress(current,total){if(total>0){bar.max=total;bar.value=current;amount.textContent=Math.min(100,Math.floor(current/total*100))+'%';stage.textContent=current>=total?'Starting…':'Loading…';}else{bar.removeAttribute('value');amount.textContent=current>0?(current/1048576).toFixed(1)+' MB':'—';}}}).then(()=>{window.stopRealmScene?.();overlay.classList.add('done');setTimeout(()=>overlay.remove(),650);document.getElementById('canvas').focus();}).catch(fail);}catch(error){fail(error);}
</script></body></html>
