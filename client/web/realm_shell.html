<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aitizen Realm</title>
$GODOT_HEAD_INCLUDE
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b2025;color:#f2eedb;font-family:system-ui}body{overflow:hidden}canvas{display:block;outline:0}#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#071d2670,#081c22ed),url('/auth-assets/realm-v2.png') center/cover;z-index:10;padding:28px}.panel{text-align:center;max-width:560px;width:100%}.eyebrow{font-size:11px;letter-spacing:.3em;color:#c7dbb5}.sigil{width:80px;height:80px;margin:0 auto 35px;border:1px solid #c5d9ad88;transform:rotate(45deg);display:grid;place-items:center;position:relative}.sigil:before{content:'';position:absolute;inset:-12px;border:1px solid #d9c79544;animation:orbit 12s linear infinite}.sigil span{transform:rotate(-45deg);font:34px Georgia;color:#e2d5a5}h1{font:clamp(36px,6vw,58px) Georgia;letter-spacing:.04em;margin:12px 0}p{color:#b5cabc;font-size:14px}.progress-row{display:flex;justify-content:space-between;color:#d5dfc6;font-size:12px;margin-top:38px}progress{appearance:none;width:100%;height:5px;margin-top:12px;border:0;border-radius:8px;background:#ffffff20}progress::-webkit-progress-bar{background:#ffffff20;border-radius:8px}progress::-webkit-progress-value{background:linear-gradient(90deg,#8ebcad,#e3d09c);border-radius:8px}progress::-moz-progress-bar{background:#c4d4a7}progress:indeterminate{animation:pulse 2s infinite}.hint{font-size:11px;line-height:1.7;color:#88a79c;margin-top:25px}.ember{position:absolute;width:3px;height:3px;background:#eedba1;border-radius:50%;left:24%;top:65%;animation:drift 8s infinite}.ember.b{left:75%;top:35%;animation-delay:-4s}button,a{display:inline-block;border:1px solid #8caf9b;background:#173b38;color:#e3edce;border-radius:7px;padding:11px 18px;text-decoration:none;font:13px system-ui;margin:8px;cursor:pointer}#error{color:#f3c6b4;white-space:pre-wrap}#recovery[hidden]{display:none}#loading.done{opacity:0;transition:opacity .45s;pointer-events:none}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.4}}@keyframes drift{50%{transform:translate(25px,-45px);opacity:.2}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><canvas id="canvas" tabindex="0">Your browser needs canvas support.</canvas><div id="loading"><i class="ember"></i><i class="ember b"></i><section class="panel"><div class="sigil" aria-hidden="true"><span>AR</span></div><div class="eyebrow">EVERY LIFE LEAVES A STORY</div><h1>Aitizen Realm</h1><p id="stage" role="status" aria-live="polite">Preparing your journey…</p><div class="progress-row"><span>WORLD ASSETS</span><span id="amount">Connecting…</span></div><progress id="progress" aria-label="Game download progress"></progress><p class="hint">The first visit downloads the game. Keep this tab open.<br>The world connects after the game starts.</p><p id="error" role="alert"></p><div id="recovery" hidden><button id="retry">Try again</button><a href="/admin/login">Sign in again</a></div></section></div><noscript>Enable JavaScript to enter Aitizen Realm.</noscript>
<script src="$GODOT_URL"></script><script>
const config=$GODOT_CONFIG;
const overlay=document.getElementById('loading'),bar=document.getElementById('progress'),amount=document.getElementById('amount'),stage=document.getElementById('stage');
document.getElementById('retry').onclick=()=>location.reload();
function fail(error){stage.textContent='Your journey could not start';document.getElementById('error').textContent=error instanceof Error?error.message:String(error);document.getElementById('recovery').hidden=false;}
try{
 const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
 if(missing.length)throw new Error('This browser is missing: '+missing.join(', '));
 const engine=new Engine(config);
 engine.startGame({onProgress(current,total){
  if(total>0){bar.max=total;bar.value=current;amount.textContent=Math.floor(current/total*100)+'%';stage.textContent=current>=total?'Starting the realm…':'Downloading the realm…';}
  else{bar.removeAttribute('value');amount.textContent=current>0?(current/1048576).toFixed(1)+' MB received':'Connecting…';}
 }}).then(()=>{overlay.classList.add('done');setTimeout(()=>overlay.remove(),500);document.getElementById('canvas').focus();}).catch(fail);
}catch(error){fail(error);}
</script></body></html>
