ading.dawn .lake-glimmer{stroke:#edd3a3}.window{transition:opacity 3s}#loading.dawn .window{opacity:.25}.veil{background:linear-gradient(0deg,#061218 0%,#061218aa 12%,transparent 46%,#06141c44)}#loading.dawn .daybreak{opacity:1}#loading.dawn .hero h1 span{color:#d9d4bc}#error{font:12px/1.5 Arial;color:#f4b79f;max-height:50px;overflow:auto;margin:10px 0 0}#error:empty{display:none}#recovery{margin-top:10px}#recovery[hidden]{display:none}#recovery button,#recovery a{border:1px solid #bda783;background:#162d31;border-radius:4px;color:#f1dfba;padding:8px 12px;font:11px Arial;cursor:pointer;text-decoration:none;display:inline-block}#loading.done{opacity:0;transition:opacity .6s;pointer-events:none}@keyframes mist{to{transform:translateX(22px);opacity:.5}}@keyframes glimmer{to{opacity:.35}}@media(min-width:651px) and (max-height:760px){.hero{top:26%}h1{font-size:clamp(42px,10.5vh,80px);margin:18px 0}.description{font-size:13px}}@media(max-height:600px){header{padding:20px 28px}.hero{top:24%}h1{font-size:clamp(38px,8vw,76px);margin:16px 0}.bottom{bottom:18px}.description{font-size:12px}.steps{margin-bottom:12px}progress{margin:12px 0}.scene-caption{top:43%}}@media(max-width:650px){.top-note{display:none}.hero{top:27%;max-width:90%}h1{font-size:64px}.description{max-width:240px}.bottom{grid-template-columns:1fr;gap:16px}.interaction{text-align:left;display:flex;gap:15px;align-items:center}.interaction p{margin:0}.scene-caption{display:none}.steps{gap:15px}.fineprint{font-size:9px}.interaction button{padding:9px 14px}}@media(max-width:650px) and (max-height:580px){.hero{top:22%}h1{font-size:42px;margin:14px 0}.description{display:none}.bottom{gap:10px}.interaction p{display:none}.steps{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script>
(()=>{
const root=document.getElementById('loading'),light=document.getElementById('light'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
light.addEventListener('click',()=>{const dawn=root.classList.toggle('dawn');light.setAttribute('aria-pressed',String(dawn));document.getElementById('light-text').textContent=dawn?'Night':'Sunrise';});
root.addEventListener('pointermove',event=>{if(reduced.matches)return;root.style.setProperty('--px',((event.clientX/innerWidth-.5)*-12)+'px');root.style.setProperty('--py',((event.clientY/innerHeight-.5)*-8)+'px');});
const canvas=document.getElementById('sky-particles'),ctx=canvas.getContext('2d');if(!ctx)return;let width=0,height=0,last=0,frame;
const stars=Array.from({length:45},(_,i)=>({x:((i*73+19)%997)/997,y:((i*137+43)%541)/1000,r:i%5===0?1.3:.65}));
function resize(){width=canvas.width=Math.round(innerWidth);height=canvas.height=Math.round(innerHeight);draw(0);}
const ripples=[];root.addEventListener("pointerdown",event=>{if(reduced.matches||event.target.closest("button,a,header,.bottom")||event.clientY<innerHeight*.58)return;ripples.push({x:event.clientX,y:event.clientY,born:performance.now()});if(ripples.length>8)ripples.shift();});function draw(t){ctx.clearRect(0,0,width,height);for(let i=0;i<stars.length;i++){const p=stars[i];ctx.fillStyle='rgba(224,230,211,'+(root.classList.contains('dawn')?.12:.3+Math.sin(t/2300+i)*.18)+')';ctx.beginPath();ctx.arc(p.x*width,p.y*height,p.r,0,Math.PI*2);ctx.fill();}
// A distant flock follows a slow arc above the mountains.
ctx.lineWidth=1.3;ctx.strokeStyle=root.classList.contains('dawn')?'#243d42':'#8fa6a555';
for(let i=0;i<5;i++){const x=(((t/85+i*19)%(width+160))-80),y=height*.23+Math.sin(x/width*3)*height*.04+Math.abs(i-2)*7,wing=Math.sin(t/210+i)*3;ctx.beginPath();ctx.moveTo(x-5,y-wing);ctx.quadraticCurveTo(x-2,y-2,x,y+1);ctx.quadraticCurveTo(x+2,y-2,x+5,y-wing);ctx.stroke();}
// Brief elliptical ripples stay within the lower lake when touched.
for(let i=ripples.length-1;i>=0;i--){const r=ripples[i],age=(t-r.born)/1800;if(age>1){ripples.splice(i,1);continue;}ctx.strokeStyle='rgba(211,221,198,'+(Math.max(0,1-age)*.35)+')';ctx.beginPath();ctx.ellipse(r.x,r.y,8+age*55,2+age*10,0,0,Math.PI*2);ctx.stroke();}
if(!root.classList.contains('dawn'))for(let i=0;i<9;i++){const x=width*(.12+i*.09)+Math.sin(t/2200+i)*9,y=height*.71+Math.sin(i*7)*height*.08+Math.cos(t/3200+i)*5;ctx.fillStyle='rgba(225,195,122,'+(.18+Math.sin(t/1700+i)*.13)+')';ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill();}
}
function tick(t){if(!root.isConnected)return;if(!document.hidden&&t-last>50){draw(reduced.matches?0:t);last=t;}frame=requestAnimationFrame(tick);}
resize();window.addEventListener('resize',resize);frame=requestAnimationFrame(tick);
window.stopRealmScene=()=>{cancelAnimationFrame(frame);window.removeEventListener('resize',resize);};
})();
</script>

const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":81193500,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const overlay=document.getElementById('loading'),bar=document.getElementById('progress'),amount=document.getElementById('amount'),stage=document.getElementById('stage');

function fail(error){stage.textContent='Unable to start the game';document.getElementById('error').textContent=error instanceof Error?error.message:String(error);document.getElementById('recovery').hidden=false;}
try{const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw new Error('This browser is missing: '+missing.join(', '));const engine=new Engine(config);engine.startGame({onProgress(current,total){if(total>0){bar.max=total;bar.value=current;amount.textContent=Math.min(100,Math.floor(current/total*100))+'%';stage.textContent=current>=total?'Starting…':'Loading…';}else{bar.removeAttribute('value');amount.textContent=current>0?(current/1048576).toFixed(1)+' MB':'—';}}}).then(()=>{window.stopRealmScene?.();overlay.classList.add('done');setTimeout(()=>overlay.remove(),650);document.getElementById('canvas').focus();}).catch(fail);}catch(error){fail(error);}
